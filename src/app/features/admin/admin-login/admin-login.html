<section class="admin-login">
  <div class="login-card">
    <h2>Admin Login</h2>
    <p>Sign in to manage your portfolio messages.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Admin email"
        [class.invalid]="loginForm.controls.email.invalid &&
                         loginForm.controls.email.touched"
      />

      <!-- Email validation messages -->
      <small
        class="validation-error"
        *ngIf="loginForm.controls.email.touched &&
               loginForm.controls.email.hasError('required')"
      >
        Email is required.
      </small>

      <small
        class="validation-error"
        *ngIf="loginForm.controls.email.touched &&
               loginForm.controls.email.hasError('email')"
      >
        Please enter a valid email address.
      </small>

      <small
        class="validation-error"
        *ngIf="loginForm.controls.email.touched &&
               loginForm.controls.email.hasError('maxlength')"
      >
        Email cannot exceed 254 characters.
      </small>


      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Admin password"
        [class.invalid]="loginForm.controls.password.invalid &&
                         loginForm.controls.password.touched"
      />

      <!-- Password validation messages -->
      <small
        class="validation-error"
        *ngIf="loginForm.controls.password.touched &&
               loginForm.controls.password.hasError('required')"
      >
        Password is required.
      </small>

      <small
        class="validation-error"
        *ngIf="loginForm.controls.password.touched &&
               loginForm.controls.password.hasError('minlength')"
      >
        Password must contain at least 12 characters.
      </small>

      <small
        class="validation-error"
        *ngIf="loginForm.controls.password.touched &&
               loginForm.controls.password.hasError('maxlength')"
      >
        Password cannot exceed 128 characters.
      </small>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Login' }}
      </button>

      <!-- API error message -->
      <p *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </p>

    </form>
  </div>
</section>
